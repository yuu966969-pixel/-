name: NekoAlarm iOS Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nekoalarm-ci-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and smoke-test NekoAlarm
    runs-on: macos-26-intel
    timeout-minutes: 35

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          xcode-select -p
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Validate app metadata
        run: plutil -lint Info.plist

      - name: Build iOS Simulator app
        run: |
          xcodebuild \
            -project NekoAlarm.xcodeproj \
            -scheme NekoAlarm \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Build unsigned iPhone device app
        run: |
          xcodebuild \
            -project NekoAlarm.xcodeproj \
            -scheme NekoAlarm \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: NekoAlarm-iOS-Simulator
          path: build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/NekoAlarm.app
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned iPhone app
        uses: actions/upload-artifact@v4
        with:
          name: NekoAlarm-iOS-Device-Unsigned
          path: build/DeviceDerivedData/Build/Products/Debug-iphoneos/NekoAlarm.app
          if-no-files-found: error
          retention-days: 14
