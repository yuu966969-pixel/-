name: NekoAlarm

options:
  bundleIdPrefix: com.nekoalarm
  deploymentTarget:
    iOS: "26.1"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  NekoAlarm:
    type: application
    platform: iOS
    sources:
      - path: あま.swift
      - path: ドパ.swift
      - path: うお.swift
      - path: あな.swift
      - path: NekoAlarmMetadata.swift
    resources:
      - path: LaunchScreen.storyboard
    info:
      path: Info.plist
      properties:
        NSAlarmKitUsageDescription: "指定した時刻にアラームを鳴らすために使用します。"
        NEKO_AI_AUDIO_ENDPOINT: "$(NEKO_AI_AUDIO_ENDPOINT)"
        UIBackgroundModes:
          - processing
        BGTaskSchedulerPermittedIdentifiers:
          - jp.example.NekoAlarm.dailyTrackRefresh
        NSSupportsLiveActivities: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchStoryboardName: LaunchScreen
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nekoalarm.app
        TARGETED_DEVICE_FAMILY: "1"
