name: NekoAlarm

options:
  bundleIdPrefix: com.nekoalarm
  deploymentTarget:
    iOS: "26.1"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  NekoAlarm:
    type: application
    platform: iOS
    sources:
      - path: あま.swift
      - path: ドパ.swift
      - path: うお.swift
      - path: あな.swift
      - path: NekoAlarmMetadata.swift
    resources:
      - path: LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nekoalarm.app
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1"
