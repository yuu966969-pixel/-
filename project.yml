name: NekoAlarm

options:
  bundleIdPrefix: com.nekoalarm
  deploymentTarget:
    iOS: "26.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  NekoAlarm:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nekoalarm.app
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        GENERATE_INFOPLIST_FILE: YES

  NekoAlarmWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: WidgetExtension
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nekoalarm.app.widget
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        INFOPLIST_KEY_NSExtension_NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - target: NekoAlarm
