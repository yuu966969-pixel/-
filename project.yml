name: NekoAlarm

options:
  bundleIdPrefix: com.nekoalarm
  deploymentTarget:
    iOS: "26.1"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  NekoAlarm:
    type: application
    platform: iOS
    sources:
      - path: あま.swift
      - path: ドパ.swift
      - path: うお.swift
      - path: あな.swift
      - path: NekoAlarmMetadata.swift
      - path: Assets.xcassets
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nekoalarm.app
        INFOPLIST_FILE: Info.plist
