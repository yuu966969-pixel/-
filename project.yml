name: NekoAlarm

options:
  bundleIdPrefix: com.nekoalarm
  deploymentTarget:
    iOS: "26.1"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  NekoAlarm:
    type: application
    platform: iOS
    sources:
      - path: あま.swift
      - path: ドパ.swift
      - path: うお.swift
      - path: あな.swift
      - path: NekoAlarmMetadata.swift
    info:
      properties:
        NSAlarmKitUsageDescription: "指定した時刻にアラームを鳴らすために使用します。"
        BGTaskSchedulerPermittedIdentifiers:
          - jp.example.NekoAlarm.dailyTrackRefresh
        NSSupportsLiveActivities: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nekoalarm.app
        GENERATE_INFOPLIST_FILE: YES
