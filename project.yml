name: NekoAlarm

options:
  bundleIdPrefix: com.nekoalarm
  deploymentTarget:
    iOS: "26.1"

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  NekoAlarm:
    type: application
    platform: iOS
    sources:
      - path: あま.swift
      - path: ドパ.swift
      - path: うお.swift
      - path: あな.swift
      - path: NekoAlarmMetadata.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nekoalarm.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
