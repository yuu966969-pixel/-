services:
  - type: web
    name: rememory-ai
    runtime: node
    plan: free
    rootDir: RE-MEMORY
    healthCheckPath: /api/health
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-6-luna
